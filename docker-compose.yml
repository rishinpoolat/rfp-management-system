version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rfp_postgres
    environment:
      POSTGRES_USER: rfpuser
      POSTGRES_PASSWORD: rfppassword
      POSTGRES_DB: rfp_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfpuser -d rfp_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rfp_network

  redis:
    image: redis:7-alpine
    container_name: rfp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rfp_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rfp_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rfp_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  rfp_network:
    driver: bridge
